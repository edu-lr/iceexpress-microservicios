services:
  productos-db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: productos_db
    volumes:
      - productos_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  productos-service:
    build: ./productos-service
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://user:pass@productos-db:5432/productos_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
    depends_on:
      - productos-db

  inventario-db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: inventario_db
    volumes:
      - inventario_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  inventario-service:
    build: ./inventario-service
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://user:pass@inventario-db:5432/inventario_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
    depends_on:
      - inventario-db

  pedidos-db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: pedidos_db
    volumes:
      - pedidos_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"

  pedidos-service:
    build: ./pedidos-service
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql://user:pass@pedidos-db:5432/pedidos_db
      PRODUCTOS_SERVICE_URL: http://productos-service:8000
      INVENTARIO_SERVICE_URL: http://inventario-service:8000
      PAGOS_SERVICE_URL: http://pagos-service:8000
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
    depends_on:
      - pedidos-db
      - productos-service
      - inventario-service
      - pagos-service

  pagos-db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: pagos_db
    volumes:
      - pagos_data:/var/lib/postgresql/data
    ports:
      - "5436:5432"

  pagos-service:
    build: ./pagos-service
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql://user:pass@pagos-db:5432/pagos_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
    depends_on:
      - pagos-db


  auth-db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: auth_db
    volumes:
      - auth_data:/var/lib/postgresql/data
    ports:
      - "5437:5432"

  auth-service:
    build: ./auth-service
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql://user:pass@auth-db:5432/auth_db
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
    depends_on:
      - auth-db


volumes:
  productos_data:
  inventario_data:
  pedidos_data:
  pagos_data:
  auth_data: